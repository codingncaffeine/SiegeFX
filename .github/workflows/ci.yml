name: CI

# Every push to main and every pull request: build the whole solution on Linux
# and on Windows with warnings as errors and run the data-free unit tests; and
# build the release artifacts (publish.sh), launch the Linux tarball as shipped
# (packaging/smoke-test.sh) and keep the artifacts for a week. The checks that
# need a Dungeon Siege install (the parity ledger, the effect traces, the menu
# rendered from the tarball) run locally: tools/receipts.sh and the smoke test
# with --ds1.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    # A hung test ends the job here, not at GitHub's six-hour limit.
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build (warnings are errors)
        run: dotnet build SiegeFX.sln -c Release -warnaserror

      - name: test-all.sh is what test-all.bat generates
        if: runner.os == 'Linux'
        run: tools/test-menu.sh --check

      # Every test is named as it passes; one that hangs is stopped after two
      # minutes with a dump.
      - name: Unit tests
        run: dotnet test tests/SiegeFX.Tests -c Release --no-build --blame-hang --blame-hang-timeout 2m --logger "console;verbosity=normal" --results-directory TestResults

      - name: Keep the hang dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 7
          if-no-files-found: ignore

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The Linux tarball and both Windows zips, as a release builds them.
      - name: Build the release artifacts
        run: ./publish.sh dev

      - name: Launch the tarball as shipped
        run: packaging/smoke-test.sh publish/SiegeFX-dev-linux-x64.tar.gz

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: siegefx-${{ github.sha }}
          path: |
            publish/*.tar.gz
            publish/*.zip
          retention-days: 7
          if-no-files-found: ignore
